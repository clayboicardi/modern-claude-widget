name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository.
permissions:
  contents: read

# A newer push to a pull request replaces its run in progress. Runs on main are never
# cancelled, so every commit there gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The wrapper JAR is a binary that runs before anything else. Check it against the
      # checksum Gradle publishes for the version the wrapper properties pin.
      - name: Validate Gradle wrapper JAR
        run: |
          version=$(sed -n 's#.*/gradle-\(.*\)-bin\.zip#\1#p' gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "${expected}  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      # Also restores and saves the Gradle caches (wrapper distribution + dependencies).
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install API 37 SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      # Robolectric downloads its Android runtime (about 240 MB) into ~/.m2 at test time,
      # outside the Gradle caches above.
      - name: Cache Robolectric runtime
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Lint, test, assemble
        run: ./gradlew lint test assembleDebug --no-daemon --stacktrace

      - name: Upload lint and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
