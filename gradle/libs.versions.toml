[versions]
agp = "9.5.2"
# AGP's built-in Kotlin ships KGP 2.2.10 as a floor. The root build file puts this newer
# KGP on the buildscript classpath (the documented way to raise it), and the Compose
# compiler plugin uses the same version so the two always match.
kotlin = "2.4.21"
glance = "1.2.0"
coreKtx = "1.19.1"
junit = "4.13.2"
robolectric = "4.18.1"

[libraries]
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
glance-testing = { group = "androidx.glance", name = "glance-testing", version.ref = "glance" }
glance-appwidget-testing = { group = "androidx.glance", name = "glance-appwidget-testing", version.ref = "glance" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
# No kotlin-android plugin: AGP 9 provides built-in Kotlin support (applying the
# standalone plugin double-registers the `kotlin` extension and fails the build).
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
